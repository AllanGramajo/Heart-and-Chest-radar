<script>
(()=>{ 'use strict';
const $=id=>document.getElementById(id);
const RESULTS=JSON.parse($('sourceData').textContent), FILTER=JSON.parse($('filterData').textContent);
// No runtime network requests: recording bytes are embedded by build_site.py.
let record=null,analysis=null,selectionMode='radar-only auto',busy=false;
const colors={bg:'#0b0b0b',fg:'#e8e8e8',gray:'#777',line:'#444',red:'#ba0c2f'};
function bars(unit){const rows=RESULTS.heart_frequency_baseline.conditions,max=unit==='Hz'?.6:36;const c=$('cohortBars');c.replaceChildren();rows.forEach((r,i)=>{let val=unit==='Hz'?r.reported_hz:r.derived_bpm;const row=document.createElement('div');row.className='bar-row';const label=document.createElement('div');label.className='bar-label';label.textContent=r.condition;const track=document.createElement('div');track.className='bar-track';const bar=document.createElement('div');bar.className='bar'+(i>=2?' bad':'');bar.style.width=(100*val/max)+'%';track.append(bar);const number=document.createElement('div');number.className='bar-val';number.textContent=val.toFixed(unit==='Hz'?4:2);row.append(label,track,number);c.append(row);});$('unitBpm').setAttribute('aria-pressed',String(unit!=='Hz'));$('unitHz').setAttribute('aria-pressed',String(unit==='Hz'));$('unitCaption').textContent=unit==='Hz'?'Original saved author output, Hz':'Unit conversion only: Hz × 60';}
$('unitBpm').onclick=()=>bars('bpm');$('unitHz').onclick=()=>bars('Hz');
function download(name,body,type='application/json'){const blob=body instanceof Blob?body:new Blob([body],{type});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),30000);}
$('exportPublished').onclick=()=>download('radar-published-results.json',JSON.stringify(RESULTS,null,2));

// ----- CSV ingestion: a format match is not proof that a local file is human data. -----
function parseCSV(text){if(typeof text!=='string'||text.length>32*1024*1024)throw Error('Expected a CSV smaller than 32 MB.');const rows=text.replace(/^\uFEFF/,'').trim().split(/\r?\n/);if(rows.length!==1500)throw Error(`Expected exactly 1,500 samples; found ${rows.length.toLocaleString()}. Use a 30 s MobiVital segment.`);const values=new Float64Array(rows.length*254);for(let r=0;r<rows.length;r++){const cols=rows[r].split(',');if(cols.length!==254)throw Error(`Row ${r+1}: expected 254 columns, found ${cols.length}. No header is supported.`);for(let c=0;c<254;c++){const s=cols[c].trim();const v=Number(s);if(!s||!Number.isFinite(v))throw Error(`Non-numeric or missing value at row ${r+1}, column ${c+1}.`);values[r*254+c]=v;}}return {n:rows.length,cols:254,fs:50,values};}
function mean(a){let s=0;for(const v of a)s+=v;return s/a.length;}
function detrend(a){const n=a.length,m=mean(a),center=(n-1)/2;let num=0,den=0;for(let i=0;i<n;i++){const d=i-center;num+=d*(a[i]-m);den+=d*d;}const b=den?num/den:0;return Float64Array.from(a,(v,i)=>v-m-b*(i-center));}
function sosFilter(input){let a=Float64Array.from(input);const start=a[0];for(let s=0;s<FILTER.sos.length;s++){const [b0,b1,b2,a0,a1,a2]=FILTER.sos[s];if(a0!==1)throw Error('Unnormalized SOS filter.');let z0=FILTER.zi[s][0]*start,z1=FILTER.zi[s][1]*start;const out=new Float64Array(a.length);for(let i=0;i<a.length;i++){const x=a[i],y=b0*x+z0;z0=b1*x-a1*y+z1;z1=b2*x-a2*y;out[i]=y;}a=out;}return a;}
function zeroPhase(a){const p=FILTER.padlen;if(a.length<=p)throw Error('Signal is too short for the filter.');const ext=new Float64Array(a.length+2*p);for(let i=0;i<p;i++)ext[i]=2*a[0]-a[p-i];ext.set(a,p);for(let i=0;i<p;i++)ext[p+a.length+i]=2*a[a.length-1]-a[a.length-2-i];let y=sosFilter(ext);y.reverse();y=sosFilter(y);y.reverse();return y.slice(p,p+a.length);}
function unwrap(a){const out=new Float64Array(a.length);out[0]=a[0];for(let i=1;i<a.length;i++){let d=a[i]-a[i-1];if(d>Math.PI)d-=2*Math.PI;else if(d<-Math.PI)d+=2*Math.PI;out[i]=out[i-1]+d;}return out;}
function normalize(a){const m=mean(a);let ss=0;for(const v of a)ss+=(v-m)**2;const sd=Math.sqrt(ss/a.length);if(!Number.isFinite(sd)||sd<1e-12)return null;return Float64Array.from(a,v=>(v-m)/sd);}
function pearson(a,b){const ma=mean(a),mb=mean(b);let ab=0,aa=0,bb=0;for(let i=0;i<a.length;i++){const x=a[i]-ma,y=b[i]-mb;ab+=x*y;aa+=x*x;bb+=y*y;}return aa>0&&bb>0?Math.max(-1,Math.min(1,ab/Math.sqrt(aa*bb))):null;}
function spectrum(a,fs){const n=a.length,k0=Math.ceil(.08*n/fs),k1=Math.floor(.70*n/fs),freq=[],power=[];let max=-Infinity,best=NaN;for(let k=k0;k<=k1;k++){let re=0,im=0;for(let i=0;i<n;i++){const w=.5-.5*Math.cos(2*Math.PI*i/(n-1)),v=a[i]*w,ang=2*Math.PI*k*i/n;re+=v*Math.cos(ang);im-=v*Math.sin(ang);}const p=re*re+im*im;freq.push(k*fs/n);power.push(p);if(p>max){max=p;best=k*fs/n;}}return {freq,power:power.map(x=>max>0?x/max:0),peakHz:max>1e-20?best:null,resolutionBpm:60*fs/n,duration:n/fs};}
function binRange(b){return .30+b*.0514;}
function binStats(rec){const scores=new Float64Array(120);for(let b=0;b<120;b++){let mi=0,mq=0;for(let t=0;t<rec.n;t++){mi+=rec.values[t*254+12+b];mq+=rec.values[t*254+132+b];}mi/=rec.n;mq/=rec.n;let vv=0;for(let t=0;t<rec.n;t++){vv+=(rec.values[t*254+12+b]-mi)**2+(rec.values[t*254+132+b]-mq)**2;}scores[b]=vv/rec.n;}return scores;}
function chooseBin(rec){const scores=binStats(rec);let best=-1,val=-Infinity;for(let b=0;b<120;b++){const r=binRange(b);if(r>=.8&&r<=2.2&&scores[b]>val){val=scores[b];best=b;}}if(best<0)throw Error('No valid bin in the fixed 0.8–2.2 m search gate.');return best;}
function analyze(rec,b){const I=new Float64Array(rec.n),Q=new Float64Array(rec.n),phase=new Float64Array(rec.n),belt=new Float64Array(rec.n),magnitudes=[];for(let t=0;t<rec.n;t++){I[t]=rec.values[t*254+12+b];Q[t]=rec.values[t*254+132+b];phase[t]=Math.atan2(Q[t],I[t]);belt[t]=rec.values[t*254+252];magnitudes.push(Math.hypot(I[t],Q[t]));}const sorted=[...magnitudes].sort((a,b)=>a-b),median=(sorted[749]+sorted[750])/2;const low=median>0?magnitudes.filter(x=>x<.1*median).length:rec.n;let nearPi=0;for(let i=1;i<phase.length;i++){const d=Math.atan2(Math.sin(phase[i]-phase[i-1]),Math.cos(phase[i]-phase[i-1]));if(Math.abs(d)>.9*Math.PI)nearPi++;}const unwrapped=unwrap(phase),radarF=zeroPhase(detrend(unwrapped)),beltF=zeroPhase(detrend(belt));const trim=100,r=radarF.slice(trim,-trim),ref=beltF.slice(trim,-trim);const rn=normalize(r),bn=normalize(ref);const rs=spectrum(r,rec.fs),bs=spectrum(ref,rec.fs),corr=rn&&bn?pearson(rn,bn):null;return {bin:b,rangeM:binRange(b),I,Q,phase:unwrapped,radar:r,belt:ref,radarNorm:rn,beltNorm:bn,radarSpectrum:rs,beltSpectrum:bs,radarRR:rs.peakHz===null?null:rs.peakHz*60,beltRR:bs.peakHz===null?null:bs.peakHz*60,corr,trimSamples:trim,lowMagnitudeSamples:low,nearPiIncrements:nearPi};}
// Portable SHA-256 fallback also works when SubtleCrypto is unavailable on local-file origins.
function portableSHA256(bytes){const K=[0x428a2f98,0x71374491,0xb5c0fbcf,0xe9b5dba5,0x3956c25b,0x59f111f1,0x923f82a4,0xab1c5ed5,0xd807aa98,0x12835b01,0x243185be,0x550c7dc3,0x72be5d74,0x80deb1fe,0x9bdc06a7,0xc19bf174,0xe49b69c1,0xefbe4786,0x0fc19dc6,0x240ca1cc,0x2de92c6f,0x4a7484aa,0x5cb0a9dc,0x76f988da,0x983e5152,0xa831c66d,0xb00327c8,0xbf597fc7,0xc6e00bf3,0xd5a79147,0x06ca6351,0x14292967,0x27b70a85,0x2e1b2138,0x4d2c6dfc,0x53380d13,0x650a7354,0x766a0abb,0x81c2c92e,0x92722c85,0xa2bfe8a1,0xa81a664b,0xc24b8b70,0xc76c51a3,0xd192e819,0xd6990624,0xf40e3585,0x106aa070,0x19a4c116,0x1e376c08,0x2748774c,0x34b0bcb5,0x391c0cb3,0x4ed8aa4a,0x5b9cca4f,0x682e6ff3,0x748f82ee,0x78a5636f,0x84c87814,0x8cc70208,0x90befffa,0xa4506ceb,0xbef9a3f7,0xc67178f2];const H=[0x6a09e667,0xbb67ae85,0x3c6ef372,0xa54ff53a,0x510e527f,0x9b05688c,0x1f83d9ab,0x5be0cd19];const length=bytes.length,n=Math.ceil((length+9)/64)*64,data=new Uint8Array(n);data.set(bytes);data[length]=128;const view=new DataView(data.buffer);view.setUint32(n-8,Math.floor(length*8/4294967296),false);view.setUint32(n-4,(length*8)>>>0,false);const r=(x,k)=>(x>>>k)|(x<<(32-k)),W=new Uint32Array(64);for(let offset=0;offset<n;offset+=64){for(let i=0;i<16;i++)W[i]=view.getUint32(offset+4*i,false);for(let i=16;i<64;i++){const x=W[i-15],y=W[i-2],s0=r(x,7)^r(x,18)^(x>>>3),s1=r(y,17)^r(y,19)^(y>>>10);W[i]=(W[i-16]+s0+W[i-7]+s1)>>>0;}let [a,b,c,d,e,f,g,h]=H;for(let i=0;i<64;i++){const s1=r(e,6)^r(e,11)^r(e,25),ch=(e&f)^(~e&g),t1=(h+s1+ch+K[i]+W[i])>>>0,s0=r(a,2)^r(a,13)^r(a,22),maj=(a&b)^(a&c)^(b&c),t2=(s0+maj)>>>0;h=g;g=f;f=e;e=(d+t1)>>>0;d=c;c=b;b=a;a=(t1+t2)>>>0;}[a,b,c,d,e,f,g,h].forEach((v,i)=>H[i]=(H[i]+v)>>>0);}return H.map(x=>x.toString(16).padStart(8,'0')).join('');}
async function sha256(text){const bytes=new TextEncoder().encode(text);if(globalThis.crypto?.subtle){try{const digest=await crypto.subtle.digest('SHA-256',bytes);return [...new Uint8Array(digest)].map(b=>b.toString(16).padStart(2,'0')).join('');}catch(e){/* Local context may deny SubtleCrypto; use the tested portable path. */}}return portableSHA256(bytes);}
function decodeCSV(bytes){if(bytes.byteLength>32*1024*1024)throw Error('File exceeds the 32 MB limit.');return new TextDecoder('utf-8',{fatal:true,ignoreBOM:true}).decode(bytes);}
function status(text,error=false){$('loadStatus').textContent=text;$('loadStatus').classList.toggle('error',error);}
function buttons(){['binSlider','autoBin','saveOffline','saveAnalysis','clearRecording'].forEach(id=>$(id).disabled=!record||busy);$('fileIn').disabled=busy;}
